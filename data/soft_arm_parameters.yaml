# Physical parameters of the current soft arm (robot 3).
# SI units throughout: m, kg, Pa, s; angles in deg.
# Source: thesis Ch. 3 (Tables 3.1, 3.3-3.8), updated with the current MATLAB parameter script.

arm_version: "robot3"
last_updated: "2026-10-25"
maintainer: ""

# ---------------------------------------------------------------------------
# Geometry
# ---------------------------------------------------------------------------
geometry:
  shape: truncated_cone
  total_length: 0.380            # physical length of the arm
  blocked_length: 0.020          # L0: length clamped inside the rigid base (not modelled)
  model_length: 0.360            # sum of section lengths
  base_radius: 0.016             # Rb, at the physical base
  tip_radius: 0.0048             # Rt
  # Radius decreases linearly from base_radius to tip_radius over total_length.

sections:
  # 1: base -> disk 1, 2: disk 1 -> disk 2, 3: disk 2 -> disk 3, 4: disk 3 -> tip
  n_sections: 4
  length: [0.025, 0.255, 0.025, 0.055]        # L1..L4
  # Gauss integration points per section (h_pt / g_pt)
  integration_points: [5, 8, 5, 5]            # free motion (used by the C++ controller)
  integration_points_contact: [5, 17, 5, 5]   # when environmental interaction is considered
  actuated: [true, true, true, false]          # section 4 has no tendons

disks:
  # Internal disks that change the direction of the tendon paths
  radius: [0.0147, 0.0072, 0.0064]             # R1, R2, R3

# ---------------------------------------------------------------------------
# Mass and material (Ecoflex 00-50)
# ---------------------------------------------------------------------------
mass:
  total_mass: 0.185
  volume: 1.416e-4

material:
  name: "Ecoflex 00-50"
  density: 1310                  # rho
  youngs_modulus: 3.02e5         # E (identified, error 1.11e-3)
  poissons_ratio: 0.4            # nu
  shear_modulus: 1.0786e5        # G = E / (2 (1 + nu))
  damping: 5.0e3                 # Pa*s (thesis Table 3.8)

# ---------------------------------------------------------------------------
# Tendon actuation
# ---------------------------------------------------------------------------
actuation:
  n_motors: 4                    # one motor per tendon
  pulley_radius: 0.0325          # Rp, 3D-printed pulley on each motor

tendons:
  n_tendons: 4
  # Counting from left to right (thesis Fig. 3.2):
  #   tendons 1 and 4 -> bending
  #   tendons 2 and 3 -> torsion (paths cross between disk 1 and disk 2)
  role: [bending, torsion, torsion, bending]

  # Angle of each tendon at the base, from the local y-axis, clockwise
  base_angle_deg: [30, 60, 120, 150]

  # Distance of the tendon path from the backbone at each station
  # [model base, disk 1, disk 2, disk 3] = local radius - inset
  # Local radii from the conical profile: [15.41, 14.67, 7.16, 6.42] mm
  # (model base is 20 mm above the physical base, after the clamped part).
  # The path varies linearly between stations; no tendons in section 4.
  inset: [0.002, 0.004, 0.002, 0.001]
  distance_from_backbone: [0.01341, 0.01067, 0.00516, 0.00542]

  # Cable length at rest (straight arm), used by the controller as Lc0
  rest_cable_length: [0.306722, 0.306829, 0.306829, 0.306722]   # tendons 1-4

  friction:
    model: "friction_model_phi (configuration-dependent)"
    mu: [0.003, 0.021, 0.005, 0.023]   # tendons 1-4

# ---------------------------------------------------------------------------
# Mocap markers (OptiTrack)
# ---------------------------------------------------------------------------
# d_x: distance along the backbone from the model base.
# [d_y, d_z]: offset from the backbone in the local frame at that point.
mocap_markers:
  - id: base
    d_x: 0.013
    d_yz: [0.0, 0.030]           # thesis value; not in current script
  - id: 1
    d_x: 0.1291
    d_yz: [0.0, -0.025]
  - id: 2
    d_x: 0.2195
    d_yz: [0.0, -0.023]
  - id: 3
    d_x: 0.280                   # at disk 2
    d_yz: [0.0, -0.021]
  - id: tip
    d_x: 0.370                   # 10 mm beyond the backbone end (tip cup)
    d_yz: [0.0, 0.0]

# ---------------------------------------------------------------------------
# History (previous values, kept for reference)
# ---------------------------------------------------------------------------
history:
  thesis_arm:
    friction_model_phi: [0.0651, 0.145, 0.0353, 0.055]
    inset: [0.004, 0.004, 0.003, 0.003]                # [Rb-4, R1-4, R2-3, R3-3] mm
    marker_d_x: [0.013, 0.1291, 0.2195, 0.280, 0.368]
    marker_d_yz: [[0, 0.030], [0, 0.025], [0, -0.021], [0, 0.020], [0, 0]]
